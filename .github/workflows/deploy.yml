
name: NLP Toolkit CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push sentiment service
        uses: docker/build-push-action@v6
        with:
          context: ./cloudsentimentService
          push: true
          tags: manaswini6i/sentiment-service:latest

      - name: Build and push grammar service
        uses: docker/build-push-action@v6
        with:
          context: ./grammerService
          push: true
          tags: manaswini6i/grammar-service:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: manaswini6i/nlp-toolkit-frontend:latest

      - name: Copy production Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,monitoring/"
          target: /home/ubuntu/
          overwrite: true

      
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu
            test -f /home/ubuntu/.env || { echo "Missing Grafana environment file"; exit 1; }
            docker compose --env-file /home/ubuntu/.env -f docker-compose.prod.yml pull
            docker compose --env-file /home/ubuntu/.env -f docker-compose.prod.yml up -d --remove-orphans
            docker compose --env-file /home/ubuntu/.env -f docker-compose.prod.yml ps
            free -h

