
services:
  sentiment-service:
    image: manaswini6i/sentiment-service:latest
    container_name: sentiment-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  languagetool:
    image: erikvl87/languagetool:latest
    container_name: languagetool
    restart: unless-stopped

  grammar-service:
    image: manaswini6i/grammar-service:latest
    container_name: grammar-service
    environment:
      - LANGUAGETOOL_URL=http://languagetool:8010
    ports:
      - "8001:8001"
    depends_on:
      - languagetool
    restart: unless-stopped

  frontend:
    image: manaswini6i/nlp-toolkit-frontend:latest
    container_name: frontend
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    restart: unless-stopped
    mem_limit: 160m

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 160m

volumes:
  prometheus-data:
  grafana-data:

